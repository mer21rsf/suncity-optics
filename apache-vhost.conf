# Example only: replace optics.example.com with your domain.
# Add this as a SEPARATE Apache site, preserving existing family/Yowie sites.
<VirtualHost *:80>
    ServerName optics.example.com
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/
    LimitRequestBody 10485760
    ErrorLog ${APACHE_LOG_DIR}/suncity-error.log
    CustomLog ${APACHE_LOG_DIR}/suncity-access.log combined
</VirtualHost>
# After configuring a domain, enable HTTPS with your certificate provider.
# Set PUBLIC_ORIGIN=https://your-domain in /etc/suncity-optics.env and restart.
